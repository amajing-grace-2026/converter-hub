  $('#go').onclick = run;
}

/* ============================================================
   Pisah PDF  (pdf-lib, halaman disalin utuh)
   ============================================================ */
// "1-3, 4-6, 8-" → [[1,2,3],[4,5,6],[8..akhir]]  (tiap bagian dipisah koma = 1 file)
function parseGroups(text, total){
  const groups = [];
  for (const part of text.split(/[,;]+/).map(s => s.trim()).filter(Boolean)){
    const m = part.match(/^(\d*)\s*-\s*(\d*)$/);
    let a, b;
    if (m){ a = m[1] ? +m[1] : 1; b = m[2] ? +m[2] : total; }
    else if (/^\d+$/.test(part)){ a = b = +part; }
    else throw new Error(`"${part}" bukan rentang halaman yang valid.`);
    if (a > b) [a, b] = [b, a];
    a = Math.max(1, a); b = Math.min(total, b);
    if (a > total || a > b) throw new Error(`"${part}" di luar jumlah halaman (${total}).`);
    groups.push([...Array(b - a + 1)].map((_, i) => a + i));
  }
  if (!groups.length) throw new Error('Tulis dulu rentang halamannya, mis. 1-3, 4-6.');
  return groups;
}

function renderSplitPdf(el){
  el.innerHTML = `
    <h2>Pisah PDF</h2>
    <p class="sub">Pecah satu PDF jadi beberapa file, atau ambil halaman tertentu saja. Diproses di browser — tidak di-upload.</p>
    <label class="drop" id="drop">
      <input type="file" id="pick" accept="application/pdf,.pdf" hidden>
      <strong>Klik atau tarik satu file PDF ke sini</strong>
      <span>Halaman disalin utuh — teks dan kualitas tidak berubah</span>
    </label>
    <div id="panel" hidden>
      <p class="meta" id="info" style="margin:14px 0 0"></p>
      <div class="opts">
        <label for="mode">Cara</label>
        <select id="mode">
          <option value="each">Setiap halaman jadi file sendiri</option>
          <option value="groups" selected>Pisah per rentang halaman</option>
          <option value="every">Setiap N halaman</option>
          <option value="extract">Ambil halaman tertentu (1 file)</option>
          <option value="remove">Hapus halaman tertentu (1 file)</option>
        </select>
        <input id="arg" class="num" style="width:200px">
        <span class="spacer"></span>
        <button class="btn primary" id="go">Pisah</button>
      </div>
      <p class="meta" id="preview"></p>
      <div class="opts" id="zipRow" hidden>
        <span class="meta" id="sum"></span>
        <span class="spacer"></span>
        <button class="btn primary" id="zip">Unduh semua (ZIP)</button>
      </div>
      <div class="list" id="list"></div>
    </div>
    <p class="note">Contoh rentang: <b>1-3, 4-6, 7-</b> menghasilkan 3 file (halaman 1–3, 4–6, dan 7 sampai akhir). Untuk "ambil"/"hapus", tulis misalnya <b>1, 3, 5-7</b>.</p>`;

  const $ = s => el.querySelector(s);
  const drop = $('#drop'), pick = $('#pick'), list = $('#list');
  let src = null, total = 0, baseName = 'dokumen', results = [];

  const HINTS = {
    each: ['', 'tidak perlu diisi'],
    groups: ['1-3, 4-6, 7-', 'rentang, pisahkan dengan koma'],
    every: ['2', 'jumlah halaman per file'],
    extract: ['1, 3, 5-7', 'halaman yang diambil'],
    remove: ['2, 4', 'halaman yang dihapus'],
  };

  // hasilkan daftar grup halaman sesuai cara yang dipilih
  function plan(){
    const mode = $('#mode').value, arg = $('#arg').value.trim();
    const all = [...Array(total)].map((_, i) => i + 1);
    if (mode === 'each') return all.map(n => [n]);
    if (mode === 'groups') return parseGroups(arg, total);
    if (mode === 'every'){
      const n = parseInt(arg, 10);
      if (!(n >= 1)) throw new Error('Isi jumlah halaman per file, mis. 2.');
      const g = []; for (let i = 0; i < total; i += n) g.push(all.slice(i, i + n)); return g;
    }
    if (!arg) throw new Error(`Tulis halaman yang ${mode === 'extract' ? 'diambil' : 'dihapus'}, mis. 1, 3, 5-7.`);
    const picked = parsePages(arg, total);
    if (mode === 'extract') return [picked];
    const keep = all.filter(n => !picked.includes(n));
    if (!keep.length) throw new Error('Semua halaman terhapus — sisakan minimal satu.');
    return [keep];
  }
  const label = g => g.length === 1 ? `hal ${g[0]}` : (g[g.length-1] - g[0] === g.length - 1 ? `hal ${g[0]}-${g[g.length-1]}` : `${g.length} hal`);

  function updatePreview(){
    if (!src) return;
    const mode = $('#mode').value, [ph, title] = HINTS[mode];
    $('#arg').placeholder = ph; $('#arg').title = title; $('#arg').hidden = mode === 'each';
    try {
      const g = plan();
      $('#preview').textContent = `Hasil: ${g.length} file — ` + g.slice(0, 8).map(label).join(', ') + (g.length > 8 ? ', …' : '');
      $('#go').disabled = false;
    } catch(e){
      // belum diisi → petunjuk biasa; sudah diisi tapi salah → merah
      $('#preview').innerHTML = $('#arg').value.trim() ? `<span class="status err">${esc(e.message)}</span>` : esc(e.message);
      $('#go').disabled = true;
    }
  }

  async function openPdf(f){
    if (!f) return;
    results = []; list.innerHTML = ''; $('#zipRow').hidden = true;
    $('#panel').hidden = false; $('#go').disabled = true;
    if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)){ $('#info').innerHTML = '<span class="status err">✗ File ini bukan PDF.</span>'; return; }
    $('#info').textContent = 'Membaca PDF…';
    try {
      await loadScript('lib/pdf-lib.min.js');
      src = await PDFLib.PDFDocument.load(new Uint8Array(await f.arrayBuffer()), { ignoreEncryption: true });
      if (src.isEncrypted){ src = null; throw new Error('PDF ini dikunci password.'); }
      total = src.getPageCount();
      baseName = f.name.replace(/\.[^.]+$/, '');
      $('#info').textContent = `${f.name} · ${total} halaman · ${fmtSize(f.size)}`;
      updatePreview();
    } catch(e){
      src = null;
      $('#info').innerHTML = `<span class="status err">✗ ${esc(e.message.includes('password') ? e.message : 'PDF rusak / tidak bisa dibaca.')}</span>`;
    }
  }

  async function split(){
    let groups;
    try { groups = plan(); } catch(e){ updatePreview(); return; }
    const btn = $('#go'); btn.disabled = true;
    results.forEach(r => URL.revokeObjectURL(r.url)); results = []; list.innerHTML = ''; $('#zipRow').hidden = true;
    const pad = String(total).length, p = n => String(n).padStart(pad, '0');
    for (let i = 0; i < groups.length; i++){
      const g = groups[i];
      $('#preview').textContent = `Membuat file ${i+1} dari ${groups.length}…`;
      const doc = await PDFLib.PDFDocument.create();
      (await doc.copyPages(src, g.map(n => n - 1))).forEach(pg => doc.addPage(pg));
      const blob = new Blob([await doc.save()], { type: 'application/pdf' });
      const mode = $('#mode').value;
      const suffix = mode === 'extract' ? 'pilihan' : mode === 'remove' ? 'sudah-dihapus' : g.length === 1 ? `hal-${p(g[0])}` : label(g).startsWith('hal ') ? `hal-${p(g[0])}-${p(g[g.length-1])}` : `bagian-${i+1}`;
      const name = `${baseName}-${suffix}.pdf`;
      const url = URL.createObjectURL(blob);
      results.push({ name, url, blob });
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="row">
          <div class="name">📄 ${esc(name)}</div>
          <span class="meta">${g.length} hal · ${fmtSize(blob.size)}</span>
          <a class="btn" href="${url}" target="_blank" rel="noopener">Lihat</a>
          <a class="btn primary" href="${url}" download="${esc(name)}">Unduh</a>
        </div>`;
      list.appendChild(item);
      if (i % 5 === 0) await tick();
    }
    $('#preview').textContent = '';
    $('#sum').textContent = `${results.length} file · ${fmtSize(results.reduce((s, r) => s + r.blob.size, 0))}`;
    $('#zipRow').hidden = results.length < 2;
    btn.disabled = false;
  }

  async function downloadZip(){
    const btn = $('#zip'), lbl = btn.textContent; btn.disabled = true; btn.textContent = 'Menyiapkan ZIP…';
    try {
      await loadScript('lib/jszip.min.js');
      const zip = new JSZip(); results.forEach(r => zip.file(r.name, r.blob));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await zip.generateAsync({ type: 'blob' }));
      a.download = baseName + '-pisah.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    } catch(e){ alert('Gagal membuat ZIP: ' + e.message); }
    btn.textContent = lbl; btn.disabled = false;
  }

  pick.onchange = () => { openPdf(pick.files[0]); pick.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => openPdf(e.dataTransfer.files[0]));
  $('#mode').onchange = () => { $('#arg').value = ''; updatePreview(); };
  $('#arg').oninput = updatePreview;
  $('#go').onclick = split;
  $('#zip').onclick = downloadZip;
}

   Word → PDF  (paste dari Word ke editor, simpan via dialog cetak → "Simpan sebagai PDF")
   ============================================================ */
const PAPERS = { a4: [210, 297], f4: [215, 330], letter: [216, 279] }; // mm
const MARGINS = { normal: 25.4, sempit: 12.7, lebar: 31.75 };         // mm
const FONTS = {
  word: '', times: '"Times New Roman", Times, serif', arial: 'Arial, Helvetica, sans-serif',
  calibri: 'Calibri, Carlito, "Segoe UI", sans-serif',
};

// bersihkan HTML hasil paste dari Word: buang script/komentar/kelas Mso, tapi pertahankan format
function cleanPastedHtml(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,meta,link,title,xml,iframe,object,embed,form,input,button').forEach(n => n.remove());
  const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_COMMENT);
  const comments = []; while (walker.nextNode()) comments.push(walker.currentNode);
  comments.forEach(c => c.remove());
  let droppedImages = 0;
  const KEEP = new Set(['style', 'href', 'src', 'colspan', 'rowspan', 'align', 'width', 'height', 'border', 'alt']);
  for (const el of [...doc.body.querySelectorAll('*')]){
    if (el.tagName.includes(':')){ el.replaceWith(...el.childNodes); continue; } // <o:p>, <v:shape> dll
    for (const a of [...el.attributes]){
      if (!KEEP.has(a.name.toLowerCase())) el.removeAttribute(a.name);
    }
    const st = el.getAttribute('style');
    if (st){
      const kept = st.split(';').map(s => s.trim()).filter(s => s && !/^mso-|^tab-stops|^layout-grid/i.test(s));
      kept.length ? el.setAttribute('style', kept.join(';')) : el.removeAttribute('style');
    }
    if (el.tagName === 'A' && /^\s*javascript:/i.test(el.getAttribute('href') || '')) el.removeAttribute('href');
    if (el.tagName === 'IMG'){
      const src = el.getAttribute('src') || '';
      if (!/^(data:image\/|https?:)/i.test(src)){ el.remove(); droppedImages++; }
    }
  }
  return { html: doc.body.innerHTML, droppedImages };
}

  $('#save').onclick = () => {
    if (!ed.textContent.trim() && !ed.querySelector('img,table')){ msg.innerHTML = '<span class="status err">Kertas masih kosong — tempel dulu isi dokumennya.</span>'; return; }
    let [w, h] = PAPERS[$('#paper').value];

    window.addEventListener('afterprint', cleanup);

  const fstyle = document.createElement('style');

/* ============================================================
   PDF → Word (.docx)
   - mode "edit": teks diambil pdf.js, disusun ulang jadi paragraf (tebal/miring/ukuran/huruf/perataan)
   - mode "persis": tiap halaman jadi gambar di dalam .docx (tampilan sama, tidak bisa diedit)
   File .docx ditulis manual (OOXML) lalu di-zip pakai JSZip.
   ============================================================ */
const xmlEsc = s => s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '')
  .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function fontFamilyFromPdf(name){
  if (!name) return '';
  let n = name.replace(/^[A-Z]{6}\+/, '').split(/[-,]/)[0].replace(/(PSMT|PS|MT)$/, '');
  n = n.replace(/([a-z])([A-Z])/g, '$1 $2').trim();
  // huruf "kembaran" (ukuran hurufnya sama persis) → nama yang ada di Windows/Word
  if (/^(Helvetica|Arial|Liberation Sans|Arimo|Nimbus Sans)/i.test(n)) return 'Arial';
  if (/^(Times|Liberation Serif|Tinos|Nimbus Roman)/i.test(n)) return 'Times New Roman';
  if (/^(Courier|Liberation Mono|Cousine|Nimbus Mono)/i.test(n)) return 'Courier New';
  if (/^Carlito/i.test(n)) return 'Calibri';
  if (/^Caladea/i.test(n)) return 'Cambria';
  if (/^(Symbol|Zapf|g_d)/i.test(n)) return '';
  return n;
}

// ubah satu halaman PDF jadi daftar paragraf
async function extractPageParas(page){
  const vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent();
  try { await page.getOperatorList(); } catch(e){} // memuat info font (tebal/miring/nama)
  const fontInfo = {};
  const info = fn => {
    if (fontInfo[fn]) return fontInfo[fn];
    let f = null; try { f = page.commonObjs.get(fn); } catch(e){}
    const name = (f && f.name) || '';
    return fontInfo[fn] = {
      bold: !!(f && (f.bold || f.black)) || /bold|black|heavy|semibold|demi/i.test(name),
      italic: !!(f && f.italic) || /italic|oblique/i.test(name),
      family: fontFamilyFromPdf(name),
    };
  };
  // ubah koordinat ke "dari atas" pakai transform viewport (menangani halaman yang diputar)
  const items = [];
  for (const it of tc.items){
    if (!it.str) continue;
    const t = pdfjsLib.Util.transform(vp.transform, it.transform);
    const size = Math.hypot(t[2], t[3]) || it.height || 10;
    const fi = info(it.fontName);
    items.push({ str: it.str, x: t[4], y: t[5], size, w: it.width, ...fi });
  }
  items.sort((a, b) => a.y - b.y || a.x - b.x);

  const lines = [];
  for (const it of items){
    const ln = lines.find(l => Math.abs(l.y - it.y) <= Math.max(l.size, it.size) * 0.45);
    if (ln){ ln.items.push(it); ln.size = Math.max(ln.size, it.size); }
    else lines.push({ y: it.y, size: it.size, items: [it] });
  }
  lines.sort((a, b) => a.y - b.y);
  for (const ln of lines){
    ln.items.sort((a, b) => a.x - b.x);
    ln.runs = []; let prevEnd = null, prevStr = '';
    for (const it of ln.items){
      let s = it.str;
      if (prevEnd !== null && it.x - prevEnd > it.size * 0.2 && !/\s$/.test(prevStr) && !/^\s/.test(s)) s = ' ' + s;
      const last = ln.runs[ln.runs.length - 1];
      const sz = Math.round(it.size * 2) / 2;
      if (last && last.bold === it.bold && last.italic === it.italic && last.size === sz && last.font === it.family) last.text += s;
      else ln.runs.push({ text: s, bold: it.bold, italic: it.italic, size: sz, font: it.family });
      prevEnd = it.x + it.w; prevStr = s;
    }
    ln.x0 = ln.items[0].x; ln.x1 = Math.max(...ln.items.map(i => i.x + i.w));
    ln.text = ln.runs.map(r => r.text).join('');
  }
  const content = lines.filter(l => l.text.trim());
  if (!content.length) return { w: vp.width, h: vp.height, paras: [], chars: 0 };

  const left = Math.min(...content.map(l => l.x0)), right = Math.max(...content.map(l => l.x1));
  const cw = Math.max(1, right - left);
  const alignOf = l => {
    const mid = (l.x0 + l.x1) / 2;
    if (l.x0 > left + cw * 0.08 && Math.abs(mid - (left + right) / 2) < cw * 0.06) return 'center';
    if (l.x0 > left + cw * 0.3 && right - l.x1 < cw * 0.03) return 'right';
    return 'left';
  };
  const BULLET = /^\s*([•●▪◦‣\-–*]|\d{1,3}[.)]|[a-zA-Z][.)])\s/;

  const paras = [];
  let cur = null, prev = null;
  for (const l of content){
    const align = alignOf(l);
    const gap = prev ? l.y - prev.y : 0;
    const newPara = !cur || gap > prev.size * 1.75 || Math.abs(l.size - prev.size) > 1.2
      || BULLET.test(l.text) || align !== cur.align
      || (align === 'left' && prev.x1 < right - cw * 0.15) // baris sebelumnya pendek = akhir paragraf
      || Math.abs(l.x0 - prev.x0) > cw * 0.08 && align === 'left' && cur.lines > 1;
    if (newPara){
      cur = { runs: l.runs.map(r => ({ ...r })), align, size: l.size, indent: align === 'left' ? l.x0 - left : 0,
              spaceBefore: prev ? Math.max(0, gap - prev.size * 1.3) : 0, lines: 1 };
      paras.push(cur);
    } else {
      const last = cur.runs[cur.runs.length - 1];
      if (last && !/[\s-]$/.test(last.text)) last.text += ' ';
      if (last && /\w-$/.test(last.text) && /^[a-z]/.test(l.text)) last.text = last.text.slice(0, -1); // gabung kata terpotong
      for (const r of l.runs){
        const lr = cur.runs[cur.runs.length - 1];
        if (lr && lr.bold === r.bold && lr.italic === r.italic && lr.size === r.size && lr.font === r.font) lr.text += r.text;
        else cur.runs.push({ ...r });
      }
      cur.lines++;
    }
    prev = l;
  }
  return { w: vp.width, h: vp.height, paras, chars: content.reduce((s, l) => s + l.text.length, 0), left, right };
}

function docxRun(r){
  // urutan elemen rPr wajib sesuai skema Word: rFonts, b, i, color, spacing, sz, szCs
  const f = r.font ? `<w:rFonts w:ascii="${xmlEsc(r.font)}" w:hAnsi="${xmlEsc(r.font)}" w:cs="${xmlEsc(r.font)}"/>` : '';
  const color = r.color && r.color !== '000000' ? `<w:color w:val="${r.color}"/>` : '';
  const sp = r.spacing ? `<w:spacing w:val="${r.spacing}"/>` : '';
  return `<w:r><w:rPr>${f}${r.bold ? '<w:b/>' : ''}${r.italic ? '<w:i/>' : ''}${color}${sp}<w:sz w:val="${Math.round(r.size * 2)}"/><w:szCs w:val="${Math.round(r.size * 2)}"/></w:rPr><w:t xml:space="preserve">${xmlEsc(r.text)}</w:t></w:r>`;
}

/* ---- mode "tata letak persis": gambar latar tanpa teks + teks yang bisa diedit di posisi aslinya ---- */
const _measureCtx = document.createElement('canvas').getContext('2d');
function measureTextPt(text, r){
  _measureCtx.font = `${r.italic ? 'italic ' : ''}${r.bold ? 'bold ' : ''}100px ${r.font ? `"${r.font}", ` : ''}Calibri, Carlito, sans-serif`;
  return _measureCtx.measureText(text).width * r.size / 100;
}
// apakah huruf ini terpasang di komputer ini? (lebar teks dengan cadangan berbeda = tidak terpasang)
const _fontOk = {};
function fontInstalled(name){
  if (!name) return false;
  if (name in _fontOk) return _fontOk[name];
  const probe = 'mmmmmmmmmmlli WQ@#0123';
  const w = fb => { _measureCtx.font = `72px "${name}", ${fb}`; return _measureCtx.measureText(probe).width; };
  return _fontOk[name] = w('monospace') === w('serif') && w('serif') === w('sans-serif');
}
// huruf yang tak terpasang diganti padanan aman supaya tampilan di Word bisa diperkirakan
function usableFont(name){
  if (fontInstalled(name)) return name;
  return /serif|roman|times|georgia|garamond|book|cambria|minion|palatino/i.test(name || '') && !/sans/i.test(name) ? 'Times New Roman' : 'Arial';
}
const DESCENT = 0.22; // perkiraan descent huruf (bagian di bawah garis dasar), relatif ke ukuran

async function renderPageCanvas(page, vp, withText){
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const g = c.getContext('2d', { willReadFrequently: true });
  if (!withText){ g.fillText = () => {}; g.strokeText = () => {}; } // pdf.js menggambar teks lewat fillText
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: g, viewport: vp }).promise;
  return { c, g };
}

async function layoutPageXml(page, pageIdx, scale, imgIndex){
  const base = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale });
  const A = await renderPageCanvas(page, vp, true);   // halaman lengkap
  const B = await renderPageCanvas(page, vp, false);  // tanpa teks → jadi gambar latar
  const W = A.c.width, H = A.c.height;
  const da = A.g.getImageData(0, 0, W, H).data, db = B.g.getImageData(0, 0, W, H).data;

  const tc = await page.getTextContent();
  try { await page.getOperatorList(); } catch(e){}
  const fcache = {};
  const finfo = fn => {
    if (fcache[fn]) return fcache[fn];
    let f = null; try { f = page.commonObjs.get(fn); } catch(e){}
    const name = (f && f.name) || '';
    return fcache[fn] = {
      bold: !!(f && (f.bold || f.black)) || /bold|black|heavy|semibold|demi/i.test(name),
      italic: !!(f && f.italic) || /italic|oblique/i.test(name),
      font: usableFont(fontFamilyFromPdf(name)),
    };
  };

  // warna teks = rata-rata piksel yang berubah saat teks dihapus; tak ada perubahan = teks tak terlihat
  function colorAt(x0, y0, x1, y1){
    x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
    x1 = Math.min(W, Math.ceil(x1)); y1 = Math.min(H, Math.ceil(y1));
    let best = [];
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++){
      const i = (y * W + x) * 4;
      const d = Math.abs(da[i] - db[i]) + Math.abs(da[i+1] - db[i+1]) + Math.abs(da[i+2] - db[i+2]);
      if (d > 90) best.push([d, da[i], da[i+1], da[i+2]]);
    }
    if (best.length < 2) return null;
    best.sort((a, b) => b[0] - a[0]); best = best.slice(0, Math.max(2, Math.ceil(best.length * 0.4)));
    const avg = k => Math.round(best.reduce((s, p) => s + p[k], 0) / best.length);
    let [r, g, b] = [avg(1), avg(2), avg(3)];
    if (Math.max(r, g, b) < 60 && Math.max(r, g, b) - Math.min(r, g, b) < 25) [r, g, b] = [0, 0, 0];
    return [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  const items = [];
  for (const it of tc.items){
    if (!it.str || !it.str.trim() && !it.str.length) continue;
    const t = pdfjsLib.Util.transform(base.transform, it.transform);
    const size = Math.hypot(t[2], t[3]) || it.height || 10;
    const rotated = Math.abs(t[1]) > 0.01 || Math.abs(t[2]) > 0.01;
    const x = t[4], y = t[5], w = it.width;
    const box = [x * scale, (y - size * 0.95) * scale, (x + w) * scale, (y + size * 0.3) * scale];
    if (rotated){
      // teks miring/diputar tidak bisa jadi teks Word di posisi sama → kembalikan ke gambar latar
      const r = Math.hypot(w, size) * scale * 1.1;
      B.g.drawImage(A.c, x * scale - r, y * scale - r, r * 2, r * 2, x * scale - r, y * scale - r, r * 2, r * 2);
      continue;
    }
    if (!it.str.trim()) continue; // item spasi dari pdf.js bisa selebar celah antar kolom; spasi dihitung sendiri dari jarak
    const color = colorAt(...box);
    if (!color) continue; // teks tak terlihat (mis. lapisan OCR di PDF hasil scan)
    items.push({ str: it.str, x, y, w, size, color, ...finfo(it.fontName) });
  }

  // kelompokkan per baris, lalu pecah baris jadi segmen kalau ada jarak lebar (kolom/tabel)
  items.sort((a, b) => a.y - b.y || a.x - b.x);
  const lines = [];
  for (const it of items){
    const ln = lines.find(l => Math.abs(l.y - it.y) <= Math.max(l.size, it.size) * 0.3);
    if (ln){ ln.items.push(it); ln.size = Math.max(ln.size, it.size); } else lines.push({ y: it.y, size: it.size, items: [it] });
  }
  let xml = '';
  const pvSegs = []; // untuk pratinjau di halaman web
  for (const ln of lines){
    ln.items.sort((a, b) => a.x - b.x);
    const segs = []; let seg = null, prevEnd = null;
    for (const it of ln.items){
      const gap = prevEnd === null ? 0 : it.x - prevEnd;
      if (!seg || gap > it.size * 1.6){ seg = { x: it.x, y: ln.y, size: ln.size, runs: [], end: it.x }; segs.push(seg); prevEnd = null; }
      let s = it.str;
      const lastRun = seg.runs[seg.runs.length - 1];
      if (prevEnd !== null && gap > it.size * 0.2 && lastRun && !/\s$/.test(lastRun.text) && !/^\s/.test(s)) s = ' ' + s;
      const sz = Math.round(it.size * 2) / 2;
      if (lastRun && lastRun.bold === it.bold && lastRun.italic === it.italic && lastRun.size === sz && lastRun.font === it.font && lastRun.color === it.color) lastRun.text += s;
      else seg.runs.push({ text: s, bold: it.bold, italic: it.italic, size: sz, font: it.font, color: it.color });
      prevEnd = it.x + it.w; seg.end = prevEnd;
    }
    for (const sg of segs){
      const text = sg.runs.map(r => r.text).join('');
      if (!text.trim()) continue;
      // samakan lebar teks Word dengan lebar asli di PDF lewat jarak antar huruf
      const want = sg.end - sg.x, have = sg.runs.reduce((s, r) => s + measureTextPt(r.text, r), 0);
      const chars = Math.max(1, text.length);
      if (have > 0 && Math.abs(want - have) / want > 0.015){
        const sp = Math.max(-40, Math.min(40, Math.round((want - have) / chars * 20)));
        sg.runs.forEach(r => r.spacing = sp);
      }
      const lineH = sg.size * 1.2;
      const top = sg.y - (lineH - sg.size * DESCENT);
      pvSegs.push({ x: sg.x, top, lineH, runs: sg.runs });
      xml += `<w:p><w:pPr><w:framePr w:hSpace="0" w:vSpace="0" w:wrap="around" w:hAnchor="page" w:vAnchor="page" w:x="${Math.round(sg.x * 20)}" w:y="${Math.round(top * 20)}"/>` +
        `<w:spacing w:before="0" w:after="0" w:line="${Math.round(lineH * 20)}" w:lineRule="exact"/></w:pPr>` +
        sg.runs.map(docxRun).join('') + '</w:p>';
    }
  }

  const jpg = new Uint8Array(await (await new Promise(r => B.c.toBlob(r, 'image/jpeg', 0.85))).arrayBuffer());
  A.c.width = A.c.height = B.c.width = B.c.height = 0;
  const cx = Math.round(base.width * 12700), cy = Math.round(base.height * 12700);
  const anchor = `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr><w:r><w:drawing>` +
    `<wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="0" behindDoc="1" locked="1" layoutInCell="1" allowOverlap="1">` +
    `<wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionH>` +
    `<wp:positionV relativeFrom="page"><wp:posOffset>0</wp:posOffset></wp:positionV><wp:extent cx="${cx}" cy="${cy}"/>` +
    `<wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/><wp:docPr id="${imgIndex}" name="Latar halaman ${pageIdx}"/><wp:cNvGraphicFramePr/>` +
    `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic>` +
    `<pic:nvPicPr><pic:cNvPr id="${imgIndex}" name="latar${pageIdx}.jpeg"/><pic:cNvPicPr/></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="rIdImg${imgIndex}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
    `</pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r></w:p>`;
  return { xml: anchor + xml, jpg, pvSegs, w: base.width, h: base.height, segs: (xml.match(/<w:framePr/g) || []).length };
}

async function pdfToDocxLayout(pdf, onProgress){
  const images = []; let body = '', segs = 0, last = null; let preview = null;
  const sectXml = (w, h) => `<w:sectPr><w:pgSz w:w="${Math.round(w*20)}" w:h="${Math.round(h*20)}"${w > h ? ' w:orient="landscape"' : ''}/>` +
    `<w:pgMar w:top="0" w:right="0" w:bottom="0" w:left="0" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>`;
  for (let n = 1; n <= pdf.numPages; n++){
    onProgress((n-1) / pdf.numPages, `Menyusun halaman ${n} dari ${pdf.numPages}…`);
    const page = await pdf.getPage(n);
    const r = await layoutPageXml(page, n, 150 / 72, n);
    page.cleanup();
    images.push(r.jpg); segs += r.segs;
    if (n === 1) preview = { jpg: r.jpg, segs: r.pvSegs, w: r.w, h: r.h };
    // tiap halaman = 1 section (ukuran kertas bisa beda-beda); paragraf penutup membawa sectPr halaman itu
    if (last) body += `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/>${sectXml(last.w, last.h)}</w:pPr></w:p>`;
    body += r.xml;
    last = r;
    await tick();
  }
  body += `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="20" w:lineRule="exact"/></w:pPr></w:p>`;
  onProgress(1, 'Menyusun file Word…');
  const blob = await buildDocx({ bodyXml: body, pageW: last.w, pageH: last.h, margins: { top: 0, bottom: 0, left: 0, right: 0 }, images, baseFont: 'Calibri', baseSize: 11 });
  return { blob, preview, chars: segs ? Infinity : 0, info: `${pdf.numPages} halaman · ${segs} blok teks bisa diedit di atas gambar latar` };
}

async function buildDocx({ bodyXml, pageW, pageH, margins, images, baseFont, baseSize }){
  await loadScript('lib/jszip.min.js');
  const tw = pt => Math.round(pt * 20);
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const sect = `<w:sectPr><w:pgSz w:w="${tw(pageW)}" w:h="${tw(pageH)}"${pageW > pageH ? ' w:orient="landscape"' : ''}/>` +
    `<w:pgMar w:top="${tw(margins.top)}" w:right="${tw(margins.right)}" w:bottom="${tw(margins.bottom)}" w:left="${tw(margins.left)}" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>`;
  const font = xmlEsc(baseFont || 'Calibri');
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${W}>` +
    `<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${font}" w:hAnsi="${font}" w:cs="${font}"/><w:sz w:val="${Math.round(baseSize * 2)}"/><w:lang w:val="id-ID"/></w:rPr></w:rPrDefault>` +
    `<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>` +
    `<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>` +
    `<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:outlineLvl w:val="0"/></w:pPr></w:style>` +
    `<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:outlineLvl w:val="1"/></w:pPr></w:style>` +
    `</w:styles>`;
  const z = new JSZip();
  const add = (n, d) => z.file(n, d, { createFolders: false }); // tanpa entri folder, seperti file Word asli
  add('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
    '<Default Extension="jpeg" ContentType="image/jpeg"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  add('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  add('word/_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    images.map((_, i) => `<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.jpeg"/>`).join('') +
    '</Relationships>');
  add('word/styles.xml', styles);
  images.forEach((img, i) => add(`word/media/image${i+1}.jpeg`, img));
  add('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${W}><w:body>${bodyXml}${sect}</w:body></w:document>`);
  return z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression: 'DEFLATE' });
}

async function pdfToDocxEditable(pdf, keepBreaks, onProgress){
  const pages = [];
  for (let n = 1; n <= pdf.numPages; n++){
    onProgress((n-1) / pdf.numPages, `Membaca teks halaman ${n} dari ${pdf.numPages}…`);
    const page = await pdf.getPage(n);
    pages.push(await extractPageParas(page));
    page.cleanup();
    await tick();
  }
  const chars = pages.reduce((s, p) => s + p.chars, 0);
  // ukuran & huruf utama = yang paling banyak dipakai
  const sizeCount = {}, fontCount = {};
  pages.forEach(p => p.paras.forEach(pa => pa.runs.forEach(r => {
    sizeCount[r.size] = (sizeCount[r.size] || 0) + r.text.length;
    if (r.font) fontCount[r.font] = (fontCount[r.font] || 0) + r.text.length;
  })));
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0]?.[0];
  const body = +(top(sizeCount) || 11), baseFont = top(fontCount) || 'Calibri';

  const first = pages[0] || { w: 595, h: 842 };
  const withText = pages.filter(p => p.paras.length);
  const leftM = withText.length ? Math.min(...withText.map(p => p.left)) : 72;
  const rightM = withText.length ? Math.min(...withText.map(p => p.w - p.right)) : 72;
  const clampM = v => Math.max(36, Math.min(108, v));
  const margins = { top: 54, bottom: 54, left: clampM(leftM), right: clampM(rightM) };

  let xml = '', paraCount = 0;
  pages.forEach((p, pi) => {
    p.paras.forEach((pa, i) => {
      const big = pa.size >= body * 1.4, mid = pa.size >= body * 1.15 && pa.runs.every(r => r.bold || !r.text.trim());
      const style = big ? 'Heading1' : mid ? 'Heading2' : '';
      const ppr = (style ? `<w:pStyle w:val="${style}"/>` : '') +
        (keepBreaks && pi > 0 && i === 0 ? '<w:pageBreakBefore/>' : '') +
        `<w:spacing w:before="${Math.round(Math.min(pa.spaceBefore, 36) * 20)}" w:after="0"/>` +
        (pa.indent > 6 ? `<w:ind w:left="${Math.round(pa.indent * 20)}"/>` : '') +
        (pa.align !== 'left' ? `<w:jc w:val="${pa.align}"/>` : '');
      xml += `<w:p><w:pPr>${ppr}</w:pPr>${pa.runs.map(docxRun).join('')}</w:p>`;
      paraCount++;
    });
  });
  if (!xml) xml = '<w:p/>';
  onProgress(1, 'Menyusun file Word…');
  const blob = await buildDocx({ bodyXml: xml, pageW: first.w, pageH: first.h, margins, images: [], baseFont, baseSize: body });
  return { blob, chars, info: `${pdf.numPages} halaman · ${paraCount} paragraf · huruf utama ${baseFont} ${body} pt` };
}

async function pdfToDocxImages(pdf, onProgress){
  const images = []; let xml = '';
  const first = (await pdf.getPage(1)).getViewport({ scale: 1 });
  for (let n = 1; n <= pdf.numPages; n++){
    onProgress((n-1) / pdf.numPages, `Merender halaman ${n} dari ${pdf.numPages}…`);
    const page = await pdf.getPage(n);
    const base = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 150 / 72 });
    const cv = document.createElement('canvas'); cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: g, viewport: vp }).promise; page.cleanup();
    images.push(new Uint8Array(await (await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85))).arrayBuffer()));
    cv.width = cv.height = 0;
    // muat di halaman pertama (sedikit lebih kecil supaya tak tumpah ke halaman kosong)
    const k = Math.min(first.width / base.width, first.height / base.height) * 0.98;
    const cx = Math.round(base.width * k * 12700), cy = Math.round(base.height * k * 12700);
    xml += `<w:p><w:pPr>${n > 1 ? '<w:pageBreakBefore/>' : ''}<w:spacing w:before="0" w:after="0"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing>` +
      `<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${n}" name="Halaman ${n}"/>` +
      `<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic>` +
      `<pic:nvPicPr><pic:cNvPr id="${n}" name="halaman${n}.jpeg"/><pic:cNvPicPr/></pic:nvPicPr>` +
      `<pic:blipFill><a:blip r:embed="rIdImg${n}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
      `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
      `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
    await tick();
  }
  onProgress(1, 'Menyusun file Word…');
  const blob = await buildDocx({ bodyXml: xml, pageW: first.width, pageH: first.height, margins: { top: 0, bottom: 0, left: 0, right: 0 }, images, baseFont: 'Calibri', baseSize: 11 });
  return { blob, chars: null, info: `${pdf.numPages} halaman dijadikan gambar 150 dpi` };
}

function renderPdfToWord(el){
  el.innerHTML = `
    <h2>PDF → Word</h2>
    <p class="sub">Ubah PDF jadi file Word (.docx) yang bisa diedit. Diproses di browser — tidak di-upload.</p>
    <label class="drop" id="drop">
      <input type="file" id="pick" accept="application/pdf,.pdf" hidden>
      <strong>Klik atau tarik satu file PDF ke sini</strong>
      <span>Paling bagus untuk PDF yang dibuat dari Word/komputer (bukan hasil scan)</span>
    </label>
    <div id="panel" hidden>
      <p class="meta" id="info" style="margin:14px 0 0"></p>
      <div class="opts">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="layout" selected>Tata letak persis — teks bisa diedit</option>
          <option value="edit">Alur teks biasa — enak untuk edit panjang</option>
          <option value="persis">Gambar saja — tidak bisa diedit</option>
        </select>
        <label id="brkWrap" style="display:flex;gap:6px;align-items:center;visibility:hidden"><input type="checkbox" id="brk" checked> Pisah halaman seperti PDF</label>
        <span class="spacer"></span>
        <button class="btn primary" id="go">Konversi ke Word</button>
      </div>
      <div class="bar" id="bar" hidden><i></i></div>
      <div id="out"></div>
    </div>
    <p class="note"><b>Tata letak persis:</b> gambar, garis, tabel, dan warna latar ditaruh sebagai gambar latar di posisi aslinya; setiap baris teks ditaruh tepat di atasnya sebagai teks Word yang bisa diedit (huruf, ukuran, tebal/miring, warna ikut). Cocok untuk brosur, sertifikat, formulir. Kalau tulisan diedit jadi lebih panjang, baris tidak otomatis turun.<br>
    <b>Alur teks biasa:</b> teks disusun jadi paragraf biasa — enak untuk menulis ulang/mengedit panjang, tapi gambar & tata letak tidak ikut.<br>
    <b>Gambar saja:</b> tampilan sama persis, tidak bisa diedit — untuk PDF hasil scan.</p>`;

  const $ = s => el.querySelector(s);
  const drop = $('#drop'), pick = $('#pick'), out = $('#out');
  let pdf = null, file = null, resultUrl = null;

  $('#mode').onchange = () => { $('#brkWrap').style.visibility = $('#mode').value === 'edit' ? 'visible' : 'hidden'; };

  async function openPdf(f){
    if (!f) return;
    $('#panel').hidden = false; out.innerHTML = ''; $('#go').disabled = true;
    if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)){ $('#info').innerHTML = '<span class="status err">✗ File ini bukan PDF.</span>'; return; }
    $('#info').textContent = 'Membuka PDF…';
    try {
      const lib = await getPdfjs();
      if (pdf) pdf.destroy();
      pdf = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
      file = f;
      $('#info').textContent = `${f.name} · ${pdf.numPages} halaman · ${fmtSize(f.size)}`;
      $('#go').disabled = false;
    } catch(e){
      pdf = null;
      $('#info').innerHTML = `<span class="status err">✗ ${e && e.name === 'PasswordException' ? 'PDF ini dikunci password.' : 'PDF tidak bisa dibuka (rusak atau tidak didukung).'}</span>`;
    }
  }

  async function convert(){
    const btn = $('#go'), bar = $('#bar');
    btn.disabled = true; bar.hidden = false; bar.firstElementChild.style.width = '0';
    const onProgress = (p, m) => { bar.firstElementChild.style.width = (p*100).toFixed(1) + '%'; out.innerHTML = `<p class="meta">${m}</p>`; };
    try {
      const mode = $('#mode').value;
      const res = mode === 'layout' ? await pdfToDocxLayout(pdf, onProgress)
        : mode === 'edit' ? await pdfToDocxEditable(pdf, $('#brk').checked, onProgress)
        : await pdfToDocxImages(pdf, onProgress);
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = URL.createObjectURL(res.blob);
      const name = file.name.replace(/\.pdf$/i, '') + '.docx';
      const scanned = mode !== 'persis' && res.chars < 30 * pdf.numPages;
      out.innerHTML = `
        <div class="item" style="margin-top:14px">
          <div class="row">
            <div class="name">📝 ${esc(name)}</div>
            <span class="meta">${fmtSize(res.blob.size)}</span>
            <a class="btn primary" href="${resultUrl}" download="${esc(name)}">Unduh Word</a>
          </div>
          <p class="meta" style="margin:6px 0 0">${esc(res.info)}</p>
          ${scanned ? '<p class="status err" style="margin:6px 0 0">Hampir tidak ada teks yang bisa diambil — PDF ini kemungkinan hasil scan/foto. Coba mode "Gambar saja".</p>' : ''}
          <p class="meta" style="margin:10px 0 4px">${res.preview ? 'Pratinjau halaman 1 (teks bisa dipilih = teks yang bisa diedit di Word):' : 'Pratinjau isi:'}</p>
          <div class="paperwrap" style="padding:12px 0;max-height:520px;overflow:auto"><div class="paper doc" id="pv" style="width:180mm;padding:12mm;min-height:0"></div></div>
        </div>`;
      if (res.preview){
        // gambar latar + teks di posisi yang sama seperti di file Word
        const p = res.preview, pv = el.querySelector('#pv');
        pv.style.padding = '0'; pv.style.position = 'relative'; pv.style.overflow = 'hidden';
        pv.style.width = `min(100% - 24px, ${Math.round(p.w * 4 / 3)}px)`; pv.style.maxWidth = 'none';
        pv.style.aspectRatio = `${p.w} / ${p.h}`;
        const bg = URL.createObjectURL(new Blob([p.jpg], { type: 'image/jpeg' }));
        pv.innerHTML = `<img src="${bg}" alt="" style="position:absolute;inset:0;width:100%;height:100%;max-width:none">`;
        const k = pv.clientWidth / p.w; // px per pt
        for (const s of p.segs){
          const d = document.createElement('div');
          d.style.cssText = `position:absolute;left:${s.x * k}px;top:${s.top * k}px;line-height:${s.lineH * k}px;white-space:pre`;
          d.innerHTML = s.runs.map(r => `<span style="font-family:'${r.font || 'Calibri'}';font-size:${r.size * k}px;` +
            `${r.bold ? 'font-weight:bold;' : ''}${r.italic ? 'font-style:italic;' : ''}color:#${r.color || '000000'};` +
            `${r.spacing ? `letter-spacing:${r.spacing / 20 * k}px;` : ''}">${esc(r.text)}</span>`).join('');
          pv.appendChild(d);
        }
      } else try {
        await loadScript('lib/mammoth.browser.min.js');
        const pv = await mammoth.convertToHtml({ arrayBuffer: await res.blob.arrayBuffer() });
        el.querySelector('#pv').innerHTML = cleanPastedHtml(pv.value).html || '<p class="meta">(kosong)</p>';
      } catch(e){ el.querySelector('#pv').textContent = 'Pratinjau tidak tersedia.'; }
    } catch(e){
      out.innerHTML = `<p class="status err">✗ ${esc(e.message || String(e))}</p>`;
    }
    bar.hidden = true; btn.disabled = false;
  }

  pick.onchange = () => { openPdf(pick.files[0]); pick.value = ''; };
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => openPdf(e.dataTransfer.files[0]));
  $('#go').onclick = convert;
}

/* ============================================================
   Kalkulator  (parser sendiri — tanpa eval; format angka Indonesia: 1.234,5)
   Ekspresi internal pakai: angka dengan '.', operator + - * /, dan % di belakang angka.
   ============================================================ */
function calcTokenize(expr){
  const t = []; let i = 0;
  while (i < expr.length){
    const c = expr[i];
    const unary = c === '-' && (t.length === 0 || t[t.length - 1].op);
    if (/[\d.]/.test(c) || unary){
      let j = i + (unary ? 1 : 0);
      while (j < expr.length && /[\d.]/.test(expr[j])) j++;
      const s = expr.slice(i, j);
      if (s === '-' || s === '.' || s === '-.') throw new Error('Belum lengkap');
      const n = { v: parseFloat(s), pct: false };
      if (expr[j] === '%'){ n.pct = true; j++; }
      t.push(n); i = j;
    } else if ('+-*/'.includes(c)){ t.push({ op: c }); i++; }
    else throw new Error('Karakter tidak dikenal');
  }
  return t;
}
function calcEvalTokens(t){
  if (!t.length || t[t.length - 1].op) throw new Error('Belum lengkap');
  // persen: "a + b%" = a + a×b/100 (seperti kalkulator HP); "a × b%" = a × b/100
  const vals = [], ops = [];
  for (let i = 0; i < t.length; i++){
    if (t[i].op){ ops.push(t[i].op); continue; }
    let v = t[i].v;
    if (t[i].pct){
      const op = t[i - 1] && t[i - 1].op;
      v = (op === '+' || op === '-') && i >= 2 ? calcEvalTokens(t.slice(0, i - 1)) * v / 100 : v / 100;
    }
    vals.push(v);
  }
  // kali/bagi dulu, baru tambah/kurang
  const v2 = [vals[0]], o2 = [];
  ops.forEach((op, k) => {
    const b = vals[k + 1];
    if (op === '*') v2[v2.length - 1] *= b;
    else if (op === '/'){ if (b === 0) throw new Error('Tidak bisa dibagi 0'); v2[v2.length - 1] /= b; }
    else { o2.push(op); v2.push(b); }
  });
  return o2.reduce((acc, op, k) => op === '+' ? acc + v2[k + 1] : acc - v2[k + 1], v2[0]);
}
function calcEval(expr){
  const r = calcEvalTokens(calcTokenize(expr));
  if (!isFinite(r)) throw new Error('Hasil terlalu besar');
  return parseFloat(r.toPrecision(12)); // buang sisa pembulatan seperti 0,1+0,2 = 0,30000000000000004
}
const _calcFmt = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 10 });
function calcFormat(n){
  if (Math.abs(n) >= 1e15 || (n !== 0 && Math.abs(n) < 1e-9)){
    const [m, ex] = n.toExponential(9).split('e');
    return _calcFmt.format(+m).replace('-', '−') + ' × 10^' + (+ex);
  }
  return _calcFmt.format(n).replace('-', '−');
}
// tampilkan ekspresi apa adanya, tapi dengan format Indonesia (ribuan '.', desimal ',')
function calcPretty(expr){
  return expr.replace(/\d*\.?\d*/g, s => {
    if (!s) return s;
    const [a, b] = s.split('.');
    const ia = a ? _calcFmt.format(+a) : (b !== undefined ? '0' : '');
    return b !== undefined ? ia + ',' + b : ia;
  })
    .replace(/([\d%,])-/g, '$1 − ')   // minus sebagai operator (setelah angka)
    .replace(/-/g, '−')                // sisanya minus di depan angka negatif
    .replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/\s+/g, ' ').trim();
}

function renderCalculator(el){
  el.innerHTML = `
    <h2>Kalkulator</h2>
    <p class="sub">Kalkulator sehari-hari dengan format angka Indonesia (1.234,5). Bisa juga pakai keyboard.</p>
    <div class="calc-wrap">
      <div class="calc">
        <div class="calc-screen" aria-live="polite">
          <div class="calc-expr" id="cExpr"></div>
          <div class="calc-res" id="cRes">0</div>
        </div>
        <div class="calc-keys" id="cKeys">
          <button class="fn" data-k="C" title="Hapus semua (Esc)">C</button>
          <button class="fn" data-k="back" title="Hapus satu (Backspace)">⌫</button>
          <button class="fn" data-k="%" title="Persen">%</button>
          <button class="op" data-k="/" title="Bagi (/)">÷</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
          <button class="op" data-k="*" title="Kali (*)">×</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
          <button class="op" data-k="-" title="Kurang (-)">−</button>
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
          <button class="op" data-k="+" title="Tambah (+)">+</button>
          <button class="fn" data-k="neg" title="Positif/negatif">±</button>
          <button data-k="0">0</button>
          <button data-k="." title="Koma desimal (, atau .)">,</button>
          <button class="eq" data-k="=" title="Hasil (Enter)">=</button>
        </div>
        <div class="opts" style="margin:12px 0 0">
          <button class="btn" id="cCopy">📋 Salin hasil</button>
          <span class="meta" id="cMsg"></span>
        </div>
      </div>
      <div class="calc-hist">
        <h3>Riwayat <button class="btn" id="cHClear" style="font-size:12px;padding:3px 10px">Hapus</button></h3>
        <ul id="cHist"></ul>
        <p class="meta" id="cHEmpty">Belum ada hitungan. Klik riwayat untuk memakai hasilnya lagi.</p>
      </div>
    </div>
    <p class="note">Keyboard: angka, <b>+ − * /</b>, <b>%</b>, koma/titik untuk desimal, <b>Enter</b> = hasil, <b>Backspace</b> hapus satu, <b>Esc</b> hapus semua. Persen: <b>200.000 − 10%</b> = 180.000 (diskon), <b>50 × 10%</b> = 5.</p>`;

  const $ = s => el.querySelector(s);
  const HKEY = 'calc_history_v1';
  let expr = '', done = false, history = [];
  try { history = JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch(e){}

  function show(){
    $('#cExpr').textContent = done ? '' : calcPretty(expr);
    const res = $('#cRes');
    res.classList.remove('err');
    if (!expr){ res.textContent = '0'; return; }
    try { res.textContent = calcFormat(calcEval(expr)); }
    catch(e){
      // saat masih mengetik (mis. "5 +"), tampilkan hitungan sejauh ini
      const partial = expr.replace(/[+\-*/.]+$/, '');
      try { res.textContent = partial ? calcFormat(calcEval(partial)) : '0'; }
      catch(e2){ res.textContent = e2.message === 'Tidak bisa dibagi 0' ? e2.message : res.textContent; if (e2.message === 'Tidak bisa dibagi 0') res.classList.add('err'); }
    }
  }
  function drawHistory(){
    $('#cHist').innerHTML = history.map((h, i) =>
      `<li><button data-i="${i}" title="Pakai hasil ini"><small>${esc(calcPretty(h.e))} =</small>${esc(calcFormat(h.r))}</button></li>`).join('');
    $('#cHEmpty').hidden = history.length > 0;
    $('#cHClear').hidden = history.length === 0;
    try { localStorage.setItem(HKEY, JSON.stringify(history)); } catch(e){}
  }
  const lastNumber = () => (expr.match(/\d*\.?\d*%?$/) || [''])[0];
  const lastChar = () => expr.slice(-1);

  function press(k){
    $('#cMsg').textContent = '';
    if (/^\d$/.test(k)){
      if (done){ expr = ''; done = false; }
      if (lastChar() === '%') expr += '*';
      const n = lastNumber();
      if (n === '0') expr = expr.slice(0, -1); // hindari 007
      if (n.replace('.', '').length >= 15) return;
      expr += k;
    } else if (k === '.'){
      if (done){ expr = ''; done = false; }
      if (lastChar() === '%') expr += '*';
      const n = lastNumber();
      if (n.includes('.')) return;
      expr += n === '' ? '0.' : '.';
    } else if ('+-*/'.includes(k)){
      done = false;
      if (!expr){ if (k === '-') expr = '-'; return; }
      if (expr === '-') return;
      if (/[+\-*/]$/.test(expr)){
        // ganti operator terakhir; tapi izinkan minus setelah × atau ÷ (angka negatif)
        if (k === '-' && /[*/]$/.test(expr)) expr += '-';
        else expr = expr.replace(/[+\-*/]+$/, '') + k;
      } else expr = expr.replace(/\.$/, '') + k;
    } else if (k === '%'){
      done = false;
      if (/\d$/.test(expr)) expr += '%';
    } else if (k === 'neg'){
      done = false;
      const n = lastNumber(); if (!n) return;
      const i = expr.length - n.length;
      const unary = expr[i - 1] === '-' && (i - 1 === 0 || /[+\-*/]/.test(expr[i - 2]));
      expr = unary ? expr.slice(0, i - 1) + expr.slice(i) : expr.slice(0, i) + '-' + expr.slice(i);
      // rapikan: 5+-3 → 5-3, 5--3 → 5+3
      expr = expr.replace(/\+-(?=[\d.]*%?$)/, '-').replace(/([\d%])--(?=[\d.]*%?$)/, '$1+');
    } else if (k === 'back'){
      done = false; expr = expr.slice(0, -1);
    } else if (k === 'C'){
      expr = ''; done = false;
    } else if (k === '='){
      if (!expr || done) return;
      try {
        const r = calcEval(expr);
        history.unshift({ e: expr, r }); history = history.slice(0, 20); drawHistory();
        $('#cExpr').textContent = calcPretty(expr) + ' =';
        expr = String(r); done = true;
        $('#cRes').textContent = calcFormat(r); $('#cRes').classList.remove('err');
        return;
      } catch(e){
        $('#cRes').textContent = e.message; $('#cRes').classList.add('err'); return;
      }
    }
    show();
  }

  $('#cKeys').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
  $('#cHist').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    expr = String(history[+b.dataset.i].r); done = true;
    $('#cExpr').textContent = ''; $('#cRes').textContent = calcFormat(+expr);
  });
  $('#cHClear').onclick = () => { history = []; drawHistory(); };
  $('#cCopy').onclick = async () => {
    if (expr === '21012025%'){ openSerialAdmin(); return; }
    const txt = $('#cRes').textContent;
    try { await navigator.clipboard.writeText(txt); $('#cMsg').textContent = '✓ Disalin: ' + txt; }
    catch(e){ $('#cMsg').textContent = 'Gagal menyalin — pilih angkanya lalu Ctrl+C.'; }
  };

  // keyboard — hanya selama kalkulator sedang dibuka
  const keysEl = $('#cKeys');
  const KEYMAP = { Enter: '=', '=': '=', Backspace: 'back', Escape: 'C', Delete: 'C', ',': '.', '.': '.', x: '*', X: '*', ':': '/' };
  function onKey(e){
    if (!keysEl.isConnected){ document.removeEventListener('keydown', onKey); return; } // alat lain sudah dibuka
    if (e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    const k = KEYMAP[e.key] || (/^[\d+\-*/%]$/.test(e.key) ? e.key : null);
    if (!k) return;
    e.preventDefault();
    press(k);
    const btn = el.querySelector(`#cKeys [data-k="${CSS.escape(k)}"]`);
    if (btn){ btn.style.background = 'var(--soft)'; setTimeout(() => btn.style.background = '', 120); }
  }
  document.addEventListener('keydown', onKey);
  drawHistory(); show();
}

/* ============================================================
   Aplikasi yang bisa di-instal (PWA): service worker + tombol "Instal aplikasi"
   ============================================================ */
(function setupInstall(){
  if ('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  const wrap = document.getElementById('installWrap'), btn = document.getElementById('installBtn'), help = document.getElementById('installHelp');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return; // sudah dibuka sebagai aplikasi
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isMobile = isIOS || /Android|Mobi/i.test(ua);
  let deferred = null;

  // Chrome, Edge, Samsung Internet: browser memberi tahu kalau aplikasi bisa di-instal
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; wrap.hidden = false; help.hidden = true; });
  window.addEventListener('appinstalled', () => { wrap.hidden = true; help.hidden = true; deferred = null; });

  // iPhone/iPad & browser lain tanpa tombol instal otomatis → tampilkan petunjuk manual
  if (isIOS) wrap.hidden = false;
  else if (isMobile) setTimeout(() => { if (!deferred) wrap.hidden = false; }, 3000);

  btn.addEventListener('click', async () => {
    if (deferred){
      deferred.prompt();
      const { outcome } = await deferred.userChoice;
      if (outcome === 'accepted') wrap.hidden = true;
      deferred = null;
      return;
    }
    help.hidden = !help.hidden;
    help.innerHTML = isIOS
      ? 'Di <b>Safari</b>: ketuk tombol <b>Bagikan</b> (kotak dengan panah ke atas ⬆️), gulir, lalu pilih <b>"Tambah ke Layar Utama"</b> → <b>Tambah</b>.'
      : 'Buka menu browser (<b>⋮</b> atau <b>≡</b>), lalu pilih <b>"Instal aplikasi"</b> atau <b>"Tambahkan ke layar utama"</b>. Paling lancar di <b>Chrome</b> atau <b>Samsung Internet</b>.';
  });
})();

    .gate-in{display:flex;gap:8px;margin-top:6px}
    .gate-in input{flex:1;min-width:0;font:inherit;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
    .gate-msg{min-height:1.5em;margin:4px 0 0;font-weight:600}
    .gate-msg.err{color:var(--err)} .gate-msg.ok{color:var(--ok)}
    .gate-note{color:var(--muted);font-size:13px;margin:14px 0 0}
    .gate-bar{background:#fff6e5;color:#7a4a00;border-bottom:1px solid #f0d49b;padding:8px 16px;font-size:14px}
    @media (prefers-color-scheme: dark){ .gate-bar{background:#3a2a0d;color:#ffd58a;border-color:#5c4316} .gate-box .logo-dark{display:inline !important} }`;
  css.id = 'gateCss';
  document.head.appendChild(css);
  if (mobile) return; // HP & tablet: tanpa aktivasi

  let gate = null, bar = null, timer = null;

  function showGate(message){
    if (bar){ bar.remove(); bar = null; }
    if (!gate){
      gate = document.createElement('div');
      gate.className = 'gate';
      gate.innerHTML = `
        <div class="gate-box" role="dialog" aria-labelledby="gTitle">
          <img class="logo logo-light" src="brand/logo.svg" alt="Amajing Labs"><img class="logo logo-dark" src="brand/logo-gelap.svg" alt="Amajing Labs">
          <h2 id="gTitle">Aktivasi Amajing Converter</h2>
          <p class="meta" style="margin:0">Aplikasi ini khusus untuk <b>laptop ASUS</b>. Aktivasi cukup <b>sekali</b> per laptop.</p>
          <ol>
            <li>Klik kanan tombol <b>Start</b> (logo Windows), lalu pilih <b>Terminal</b> atau <b>Windows PowerShell</b>.</li>
            <li>Salin perintah ini, tempel di jendela tadi (klik kanan), lalu tekan <b>Enter</b>. Serial number laptop langsung tersalin.
              <div class="gate-cmd"><code id="gCmd">(Get-CimInstance Win32_BIOS).SerialNumber | Set-Clipboard</code><button class="btn" id="gCopy" type="button">📋 Salin perintah</button></div></li>
            <li>Tempel (<b>Ctrl+V</b>) serial number di sini:
              <form class="gate-in" id="gForm"><input id="gSn" autocomplete="off" spellcheck="false" placeholder="Serial number" maxlength="40" aria-label="Serial number"><button class="btn primary" id="gGo">Aktifkan</button></form>
              <p class="gate-msg" id="gMsg" aria-live="polite"></p></li>
          </ol>
          <p class="gate-note">Butuh bantuan? Hubungi toko tempat kamu membeli laptop. Di HP dan tablet, aplikasi ini bisa langsung dipakai tanpa aktivasi.</p>
        </div>`;
      document.body.appendChild(gate);
      const msg = gate.querySelector('#gMsg'), input = gate.querySelector('#gSn'), go = gate.querySelector('#gGo');
      gate.querySelector('#gCopy').onclick = async () => {
        try { await navigator.clipboard.writeText(gate.querySelector('#gCmd').textContent); gate.querySelector('#gCopy').textContent = '✓ Tersalin'; }
        catch(e){ getSelection().selectAllChildren(gate.querySelector('#gCmd')); }
      };
      gate.querySelector('#gForm').onsubmit = async e => {
        e.preventDefault();
        const sn = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (sn.length < 5){ setMsg('Serial number belum diisi atau terlalu pendek.', 'err'); return; }
        go.disabled = true; setMsg('Mengecek serial number…', '');
        const r = await ask(sn);
        go.disabled = false;
        handle(sn, r, true);
      };
      function setMsg(t, cls){ msg.textContent = t; msg.className = 'gate-msg ' + cls; }
      gate.setMsg = setMsg;
      const prev = load(); if (prev && prev.sn) input.value = prev.sn;
      setTimeout(() => input.focus(), 50);
    }
    if (message) gate.setMsg(message, 'err');
  }

  function hideGate(){ if (gate){ gate.remove(); gate = null; } }

  function showBar(until){
    if (!bar){ bar = document.createElement('div'); bar.className = 'gate-bar'; document.querySelector('.content').prepend(bar); }
    const m = Math.max(1, Math.ceil((until - Date.now()) / 60e3));
    bar.innerHTML = `⏳ Serial number laptop ini sedang diverifikasi. Aplikasi tetap bisa dipakai selama masa tunggu (<b>sisa ±${m} menit</b>). Pengecekan ulang otomatis setiap 5 menit.`;
  }

  async function ask(sn){
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
    try {
      const res = await fetch(AKTIVASI_URL, { method: 'POST', signal: ctl.signal,
        body: JSON.stringify({ sn, device, version: APP_VERSION, ua: navigator.userAgent }) });
      return await res.json();
    } catch(e){ return { status: 'offline' }; }
    finally { clearTimeout(t); }
  }

  // r.status: ok | pending | locked | used | invalid | error | offline
  function handle(sn, r, fromForm){
    const s = load() || {};
    if (r.status === 'ok'){
      save({ sn, status: 'ok', checked: Date.now() });
      if (fromForm && gate){ gate.setMsg('✓ Laptop ASUS terverifikasi. Selamat memakai!', 'ok'); setTimeout(hideGate, 1200); }
      else hideGate();
      if (bar){ bar.remove(); bar = null; }
      schedule(RECHECK_OK);
    } else if (r.status === 'pending'){
      save({ sn, status: 'pending', until: r.until, checked: Date.now() });
      hideGate(); showBar(r.until); schedule(PENDING_CHECK);
    } else if (r.status === 'offline'){
      if (fromForm){ gate.setMsg('Tidak bisa terhubung ke server. Periksa internet, lalu coba lagi.', 'err'); return; }
      // tidak ada internet: pakai status terakhir yang tersimpan
      if (s.status === 'ok'){ schedule(HOUR); return; }
      if (s.status === 'pending' && Date.now() < s.until){ showBar(s.until); schedule(PENDING_CHECK); return; }
      showGate(s.status === 'pending' ? 'Masa tunggu sudah habis. Sambungkan internet supaya serial bisa dicek ulang.' : '');
    } else {
      const text = {
        locked: 'Serial number ini belum terdaftar sebagai laptop ASUS. Hubungi toko tempat kamu membeli laptop.',
        used: 'Serial number ini sudah terpakai di perangkat lain. Satu serial hanya untuk satu laptop. Hubungi toko tempat kamu membeli laptop.',
        invalid: 'Format serial number tidak dikenali. Pastikan yang ditempel hasil dari perintah di langkah 2.',
      }[r.status] || (r.message || 'Terjadi kesalahan di server. Coba lagi sebentar lagi.');
      if (r.status === 'locked' || r.status === 'used') save({ sn, status: r.status, checked: Date.now() });
      showGate(text);
      if (r.status === 'locked' && s.sn === sn) schedule(PENDING_CHECK); // tetap dicek ulang: siapa tahu serial baru ditambahkan
    }
  }

  function schedule(ms){
    clearTimeout(timer);
    timer = setTimeout(recheck, ms);
  }
  async function recheck(){
    const s = load();
    if (!s || !s.sn) return;
    if (!navigator.onLine){ handle(s.sn, { status: 'offline' }, false); return; }
    handle(s.sn, await ask(s.sn), false);
  }
  window.addEventListener('online', () => { const s = load(); if (s && s.status !== 'ok') recheck(); });

  // saat aplikasi dibuka
  const s = load();
  if (!s || !s.sn) showGate('');
  else if (s.status === 'ok'){
    // sudah aktif: langsung pakai; sesekali lapor ke server (tercatat sebagai pengguna aktif)
    if (Date.now() - (s.checked || 0) > RECHECK_OK) recheck(); else schedule(RECHECK_OK - (Date.now() - s.checked));
  } else if (s.status === 'pending'){
    if (Date.now() < s.until) showBar(s.until); else showGate('Masa tunggu sudah habis. Mengecek ulang serial number…');
    recheck();
  } else { showGate(''); recheck(); }
})();

/* Panel admin tersembunyi: tambah serial number ke daftar ASUS (dibuka dari kalkulator, dilindungi PIN di server). */
function openSerialAdmin(){
  if (!AKTIVASI_URL || document.getElementById('serialAdmin')) return;
  const PKEY = 'amajing_admin_pin';
  let saved = ''; try { saved = localStorage.getItem(PKEY) || ''; } catch(e){}
  const box = document.createElement('div');
  box.className = 'gate'; box.id = 'serialAdmin'; box.style.zIndex = 60;
  box.innerHTML = `
    <div class="gate-box" role="dialog" aria-labelledby="aTitle">
      <h2 id="aTitle">Tambah serial number</h2>
      <p class="meta" id="aInfo" style="margin:0">Serial baru langsung masuk ke daftar ASUS.</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 0">
        <label for="aPin"><b>PIN</b></label>
        <input id="aPin" type="password" inputmode="numeric" autocomplete="off" class="num" style="width:140px" value="${esc(saved)}">
        <label style="display:flex;gap:6px;align-items:center" class="meta"><input type="checkbox" id="aRem" ${saved ? 'checked' : ''}> Ingat di perangkat ini</label>
      </div>
      <label for="aList" style="display:block;margin:14px 0 4px"><b>Serial number</b> <span class="meta">(satu per baris, boleh banyak sekaligus)</span></label>
      <textarea id="aList" rows="6" spellcheck="false" style="width:100%;font:15px Consolas,monospace;text-transform:uppercase;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
        <button class="btn" id="aClose" type="button">Tutup</button>
        <button class="btn primary" id="aGo" type="button">Tambahkan</button>
      </div>
      <p class="gate-msg" id="aMsg" aria-live="polite"></p>
      <div class="meta" id="aOut" style="font-size:13px"></div>
    </div>`;
  document.body.appendChild(box);
  const $ = s => box.querySelector(s);
  const msg = (t, cls) => { $('#aMsg').textContent = t; $('#aMsg').className = 'gate-msg ' + (cls || ''); };
  const close = () => { box.remove(); document.removeEventListener('keydown', onEsc); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  $('#aClose').onclick = close;

  async function call(body){
    try {
      const res = await fetch(AKTIVASI_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pin: $('#aPin').value.trim() }, body)) });
      return await res.json();
    } catch(e){ return { status: 'offline', message: 'Tidak bisa terhubung ke server. Periksa internet.' }; }
  }
  function remember(){
    try { if ($('#aRem').checked) localStorage.setItem(PKEY, $('#aPin').value.trim()); else localStorage.removeItem(PKEY); } catch(e){}
  }
  async function info(){
    const r = await call({ action: 'admin_info' });
    if (r.status === 'ok'){
      $('#aInfo').textContent = `Total di daftar: ${r.total} serial` + (r.recent.length ? ` · terakhir: ${r.recent.join(', ')}` : '');
      remember();
    } else msg(r.message || 'Gagal.', 'err');
  }

  $('#aGo').onclick = async () => {
    const list = $('#aList').value.split(/[\s,;]+/).map(v => v.trim()).filter(Boolean);
    if (!$('#aPin').value.trim()){ msg('Isi PIN dulu.', 'err'); $('#aPin').focus(); return; }
    if (!list.length){ msg('Tempel minimal satu serial number.', 'err'); $('#aList').focus(); return; }
    $('#aGo').disabled = true; msg('Menyimpan…');
    const r = await call({ action: 'admin_add', serials: list });
    $('#aGo').disabled = false;
    if (r.status !== 'ok'){ msg(r.message || 'Gagal menyimpan.', 'err'); return; }
    remember();
    msg(`✓ ${r.added.length} ditambahkan` + (r.existing.length ? ` · ${r.existing.length} sudah ada` : '') + (r.invalid.length ? ` · ${r.invalid.length} tidak valid` : ''), r.added.length ? 'ok' : '');
    $('#aOut').innerHTML = [
      r.added.length ? `<b>Ditambahkan:</b> ${esc(r.added.join(', '))}` : '',
      r.existing.length ? `<b>Sudah ada:</b> ${esc(r.existing.join(', '))}` : '',
      r.invalid.length ? `<b>Tidak valid:</b> ${esc(r.invalid.join(', '))}` : '',
    ].filter(Boolean).join('<br>');
    $('#aInfo').textContent = `Total di daftar: ${r.total} serial`;
    $('#aList').value = r.invalid.join('\n');
  };

  if ($('#aPin').value) { info(); setTimeout(() => $('#aList').focus(), 50); }
  else setTimeout(() => $('#aPin').focus(), 50);
}

openTool((location.hash || '').slice(1));
